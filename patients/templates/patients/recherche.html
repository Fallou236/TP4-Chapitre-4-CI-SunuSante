{% load static %}
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>SunuSanté — Recherche patient</title>
    <link rel="stylesheet" href="{% static 'rendezvous/style.css' %}">
</head>
<body>
    <header>
        <h1>SunuSanté</h1>
        <p>Recherche patient</p>
    </header>

    <main>
        <form method="get">
            <label for="q">Nom ou prénom</label>
            <input type="text" name="q" id="q" value="{{ q }}" autofocus>
            <button type="submit">Rechercher</button>
        </form>

        {% if q %}
            <table>
                <thead>
                    <tr>
                        <th>Nom</th>
                        <th>Prénom</th>
                        <th>Email</th>
                        <th>VIP</th>
                    </tr>
                </thead>
                <tbody>
                    {% for patient in resultats %}
                        <tr>
                            <td>{{ patient.nom }}</td>
                            <td>{{ patient.prenom }}</td>
                            <td>{{ patient.email }}</td>
                            <td>{{ patient.est_vip }}</td>
                        </tr>
                    {% empty %}
                        <tr><td colspan="4">Aucun résultat</td></tr>
                    {% endfor %}
                </tbody>
            </table>
        {% endif %}
    </main>
</body>
</html>
